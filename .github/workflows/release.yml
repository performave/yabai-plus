name: release

# Build, sign, and publish a yabai-plus release.
#
# Triggers when you push a tag like `v7.1.25-plus.1`. Runs on a macOS runner,
# builds a universal (x86_64 + arm64) binary, signs it with the hardened runtime,
# then creates a GitHub Release with the `yabai-v<version>.tar.gz` archive
# attached.
#
# The MACOS_SIGNING repository variable (Settings > Secrets and variables >
# Actions > Variables) picks the signature, so getting a paid Apple Developer
# account back means changing a variable, not this file:
#
#   adhoc      Default, used when the variable is unset. Needs no certificate
#              and reads no Apple secret. The Accessibility grant is pinned to
#              this exact build, so every upgrade must be approved again.
#   signed     Signs with the certificate in APPLE_CERTIFICATE, with no
#              notarization. A free account's Apple Development certificate
#              is enough, and it keeps the Accessibility grant across upgrades.
#   notarized  Signs with a Developer ID Application certificate and notarizes
#              it with notarytool (App Store Connect API key). Needs a paid
#              Apple Developer Program membership.
#
# Secret names match the rift-plus and easel repos, so the same values work:
#   APPLE_CERTIFICATE           signed, notarized: base64 of the exported .p12
#                               (export from Keychain Access; `base64 -i cert.p12 | pbcopy`)
#   APPLE_CERTIFICATE_PASSWORD  signed, notarized: password set when exporting the .p12
#   APPLE_SIGNING_IDENTITY      signed, notarized: e.g. "Developer ID Application: Eric Wang (TEAMID)"
#   APPLE_API_KEY               notarized: App Store Connect API key id   (e.g. ABC123DEF4)
#   APPLE_API_ISSUER            notarized: App Store Connect issuer id    (a UUID)
#   APPLE_API_PRIVATE_KEY       notarized: raw contents of AuthKey_XXXX.p8 (paste the PEM text)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v7.1.25-plus.1
        required: true

permissions:
  contents: write   # needed to create the GitHub Release

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    # macos-14 is gone: brownouts through October 2026, unsupported from
    # November 2nd (actions/runner-images#13518). Pinned to 26, as rift-plus
    # is, rather than macos-latest, so the SDK a release links against never
    # moves on its own.
    runs-on: macos-26
    steps:
      # Checked before anything is built, so a typo in the variable fails here
      # instead of being quietly treated as one of the modes.
      - name: Choose signing mode
        id: signing
        env:
          MODE: ${{ vars.MACOS_SIGNING || 'adhoc' }}
        run: |
          set -euo pipefail
          case "$MODE" in
            adhoc|signed|notarized) ;;
            *)
              echo "::error::MACOS_SIGNING is '$MODE'; expected adhoc, signed or notarized (docs/ci-setup.md)"
              exit 1
              ;;
          esac
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "Signing mode: ${MODE}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Import Apple signing certificate
        # Creates a temporary `signing_temp` keychain, imports the certificate,
        # and sets the key partition list so codesign can use it
        # non-interactively. Replaces the manual `security` keychain dance.
        if: steps.signing.outputs.mode != 'adhoc'
        uses: apple-actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build (universal)
        run: make install VERSION="${RELEASE_TAG}"

      - name: Build man page
        run: |
          set -euo pipefail
          brew install asciidoctor >/dev/null
          make man

      # An ad-hoc signature has no identity for Apple's timestamp server to
      # vouch for, so it is made without a timestamp.
      - name: Codesign (hardened runtime)
        env:
          MODE: ${{ steps.signing.outputs.mode }}
          # Not even read in adhoc mode: the identity left over in the secrets
          # may be a revoked one.
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.mode != 'adhoc' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: |
          set -euo pipefail
          if [ "$MODE" = adhoc ]; then
            sign=(--sign - --timestamp=none)
          elif [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            sign=(--sign "$APPLE_SIGNING_IDENTITY" --timestamp)
          else
            echo "::error::MACOS_SIGNING=${MODE} needs the APPLE_SIGNING_IDENTITY secret (docs/ci-setup.md)"
            exit 1
          fi
          codesign --force --options runtime "${sign[@]}" bin/yabai
          codesign --verify --strict --verbose=2 bin/yabai
          codesign -dvv bin/yabai

      - name: Prepare App Store Connect API key
        if: steps.signing.outputs.mode == 'notarized'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Notarize
        if: steps.signing.outputs.mode == 'notarized'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          # notarytool needs a zip/pkg/dmg; a bare Mach-O can't be submitted directly.
          ditto -c -k --keepParent bin/yabai "$RUNNER_TEMP/yabai-notarize.zip"

          xcrun notarytool submit "$RUNNER_TEMP/yabai-notarize.zip" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          # NOTE: a standalone CLI binary can't be stapled; Gatekeeper verifies the
          # notarization ticket online on first run, which is sufficient.

      - name: Apply Finder icon
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/pyobjc-venv"
          source "$RUNNER_TEMP/pyobjc-venv/bin/activate"
          python3 -m pip install pyobjc-framework-Cocoa >/dev/null
          make icon

      - name: Assemble archive
        id: archive
        run: |
          set -euo pipefail
          VERSION="$(bin/yabai --version)"   # e.g. yabai-v7.1.25-plus.1
          rm -rf archive && mkdir -p archive
          cp -r bin archive/
          cp -r doc archive/
          cp -r examples archive/
          tar -cvzf "bin/${VERSION}.tar.gz" archive
          rm -rf archive
          SHA256="$(shasum -a 256 "bin/${VERSION}.tar.gz" | cut -d' ' -f1)"
          printf '%s  %s.tar.gz\n' "${SHA256}" "${VERSION}" > "bin/${VERSION}.tar.gz.sha256"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tarball=bin/${VERSION}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=bin/${VERSION}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          echo "asset=${VERSION}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "Built ${VERSION}.tar.gz  sha256=${SHA256}"

      - name: Extract changelog notes
        id: notes
        run: |
          set -euo pipefail
          # Tag is e.g. v7.1.25-plus.1 -> changelog heading is "## [7.1.25-plus.1]".
          TAG="${RELEASE_TAG}"
          HEADING="${TAG#v}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          # Pull the body between this version's heading and the next "## " heading.
          awk -v h="## [${HEADING}]" '
            index($0, h) == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md | sed '/./,$!d' > "$NOTES_FILE"

          if [ -s "$NOTES_FILE" ]; then
            echo "Found changelog section for ${HEADING}:"
            cat "$NOTES_FILE"
            echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "No changelog section for ${HEADING}; will fall back to generated notes."
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ steps.archive.outputs.version }}
          files: |
            ${{ steps.archive.outputs.tarball }}
            ${{ steps.archive.outputs.checksum }}
          body_path: ${{ steps.notes.outputs.file }}
          # Fall back to auto-generated notes only if no changelog section was found.
          generate_release_notes: ${{ steps.notes.outputs.file == '' }}

      - name: Bump Homebrew tap formula
        # Updates Formula/yabai-plus.rb in Performave/homebrew-tap to point at the
        # release just published. Requires a HOMEBREW_TAP_TOKEN secret (a token
        # with contents:write on the tap repo); skipped if it isn't configured.
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          ASSET: ${{ steps.archive.outputs.asset }}
          SHA256: ${{ steps.archive.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set; skipping tap bump."
            exit 0
          fi

          TAP_REPO="Performave/homebrew-tap"
          FORMULA="Formula/yabai-plus.rb"
          PLUS_VERSION="${TAG#v}"   # v7.1.25-plus.1 -> 7.1.25-plus.1
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"

          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          cd tap

          # macOS runner -> BSD sed. Replace only the top-level formula fields.
          sed -i '' -E \
            -e "s|^  url \".*\"|  url \"${URL}\"|" \
            -e "s|^  version \".*\"|  version \"${PLUS_VERSION}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${SHA256}\"|" \
            "${FORMULA}"

          echo "Updated ${FORMULA}:"
          grep -E '^  (url|version|sha256) ' "${FORMULA}"

          if git diff --quiet -- "${FORMULA}"; then
            echo "Formula already up to date; nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "yabai-plus ${PLUS_VERSION}"
          git push
